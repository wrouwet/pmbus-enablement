# The PMBus target on LPI2C0.
CONFIG_I2C=y
CONFIG_I2C_TARGET=y

# Sensors: the P3T1755 on I3C0 and the die temperature through the ADC.
CONFIG_SENSOR=y
CONFIG_I3C=y
CONFIG_ADC=y

CONFIG_GPIO=y
CONFIG_HWINFO=y

# STORE_DEFAULT_ALL writes to the storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y

CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MAIN_STACK_SIZE=1536


# Hardening: a stack overflow faults at once (ARMv8-M stack limit registers) instead of
# silently corrupting memory. (Stack canaries would need an entropy source; this SoC has none
# in Zephyr, and a fixed canary is guessable.)
CONFIG_HW_STACK_PROTECTION=y
